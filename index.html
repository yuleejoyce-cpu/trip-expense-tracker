<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 紐約班夫黃刀極光之旅 - 行程記帳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK TC', sans-serif;
            background: linear-gradient(135deg, #f5f3f0 0%, #fef9f5 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            color: #2d5f52;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .header p {
            font-size: 13px;
            color: #888;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #2d5f52;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title .settings-btn {
            font-size: 14px;
            cursor: pointer;
            background: #e8dcc8;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            color: #6b5a48;
        }
        .user-info {
            text-align: center;
            padding: 12px;
            background: #f9f7f5;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            border-left: 3px solid #d4934e;
        }
        .user-name {
            color: #d4934e;
            font-weight: 600;
            margin: 0 5px;
        }
        .user-selector {
            display: inline-block;
            margin-left: 10px;
        }
        .user-selector select {
            padding: 6px 10px;
            border: 1px solid #d4934e;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            background: white;
            color: #2d5f52;
        }
        .sync-status {
            color: #2e7d32;
            font-weight: 600;
            margin-left: 5px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #2d5f52;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0dbd3;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #d4934e;
            box-shadow: 0 0 0 3px rgba(212, 147, 78, 0.1);
        }
        .button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4934e 0%, #c77f3d 100%);
            color: white;
            width: 100%;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 147, 78, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #e8b4a8;
            color: white;
            font-size: 12px;
            padding: 6px 10px;
        }
        .btn-danger:hover {
            background: #d99888;
        }
        .btn-secondary {
            background: #e8dcc8;
            color: #6b5a48;
            width: auto;
        }
        .timeline-item {
            padding: 12px;
            background: #f9f7f5;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #d4934e;
        }
        .timeline-date {
            font-weight: 600;
            color: #2d5f52;
            font-size: 12px;
            margin-bottom: 3px;
        }
        .timeline-activity {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
        }
        .timeline-accommodation {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }
        .expense-form {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0dbd3;
        }
        .expense-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .stat-card {
            background: #f5f3f0;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #d4934e;
        }
        .stat-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #2d5f52;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #fef9f5;
            border-left: 3px solid #d4934e;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .expense-info {
            flex: 1;
        }
        .expense-date {
            font-size: 11px;
            color: #999;
            margin-bottom: 2px;
        }
        .expense-category {
            display: inline-block;
            background: #e8dcc8;
            color: #6b5a48;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-right: 5px;
            font-weight: 600;
        }
        .expense-amount {
            font-weight: 700;
            color: #d4934e;
            text-align: right;
        }
        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #999;
            font-size: 13px;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2e7d32;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        .notification.error {
            background: #d32f2f;
        }
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Modal 設定面板 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }
        .modal.show {
            display: block;
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d5f52;
            margin-bottom: 15px;
        }
        .modal-close {
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #333;
        }
        .option-group {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0dbd3;
        }
        .option-group-title {
            font-size: 13px;
            font-weight: 600;
            color: #2d5f52;
            margin-bottom: 10px;
        }
        .option-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .option-item input {
            flex: 1;
            margin: 0;
        }
        .option-item .btn-remove {
            background: #e8b4a8;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .option-item .btn-remove:hover {
            background: #d99888;
        }
        .add-option-group {
            display: flex;
            gap: 8px;
        }
        .add-option-group input {
            flex: 1;
        }
        .add-option-group button {
            background: #d4934e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }
        .modal-footer {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .modal-footer button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-save {
            background: #d4934e;
            color: white;
        }
        .btn-cancel {
            background: #e8dcc8;
            color: #6b5a48;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✈️ 2026 紐約班夫黃刀極光之旅</h1>
            <p>行程 × Google Sheets 即時同步記帳 | 2026年11月26日 ~ 12月8日</p>
        </div>

        <div class="user-info" id="userInfo">
            當前使用者：<span class="user-name" id="userDisplay">Joyce</span>
            <div class="user-selector">
                <select id="userSelect" onchange="changeUser()"></select>
            </div>
            <span class="sync-status">🔄 已連接</span>
        </div>

        <div class="main-grid">
            <!-- 左側：行程 -->
            <div class="card">
                <div class="card-title">📅 行程時間軸</div>
                <div id="timelineList"></div>
            </div>

            <!-- 右側：記帳 -->
            <div class="card">
                <div class="card-title">
                    💰 支出記帳
                    <button class="settings-btn" onclick="openSettingsModal()">⚙️ 設定</button>
                </div>
                
                <div class="expense-form">
                    <div class="expense-form-grid">
                        <div class="form-group">
                            <label class="form-label">日期</label>
                            <input type="date" id="expenseDate">
                        </div>
                        <div class="form-group">
                            <label class="form-label">幣別</label>
                            <select id="expenseCurrency"></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">類別</label>
                        <select id="expenseCategory"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">內容（說明）</label>
                        <input type="text" id="expenseDesc" placeholder="例如：GetYourGuide 班夫一日遊">
                    </div>
                    <div class="form-group">
                        <label class="form-label">金額</label>
                        <input type="number" id="expenseAmount" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">備註（可選）</label>
                        <input type="text" id="expenseMemo" placeholder="">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="button btn-primary" onclick="addExpense()" style="flex: 1;">➕ 新增支出</button>
                        <button class="button btn-secondary" onclick="refreshExpenses()" style="flex: 0;">🔄</button>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">總支出</div>
                        <div class="stat-value" id="totalAmount">$0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">交易數</div>
                        <div class="stat-value" id="totalCount">0</div>
                    </div>
                </div>

                <div id="expenseListContainer">
                    <div class="empty-state">⏳ 載入中...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定 Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeSettingsModal()">&times;</span>
            <div class="modal-title">⚙️ 彈性設定</div>

            <!-- 類別設定 -->
            <div class="option-group">
                <div class="option-group-title">類別選項</div>
                <div id="categoryList"></div>
                <div class="add-option-group">
                    <input type="text" id="newCategory" placeholder="新增類別（例：📸 娛樂）">
                    <button onclick="addCategory()">+ 新增</button>
                </div>
            </div>

            <!-- 幣別設定 -->
            <div class="option-group">
                <div class="option-group-title">幣別選項</div>
                <div id="currencyList"></div>
                <div class="add-option-group">
                    <input type="text" id="newCurrency" placeholder="新增幣別（例：GBP）">
                    <button onclick="addCurrency()">+ 新增</button>
                </div>
            </div>

            <!-- 人名設定 -->
            <div class="option-group">
                <div class="option-group-title">使用者名單</div>
                <div id="userList"></div>
                <div class="add-option-group">
                    <input type="text" id="newUser" placeholder="新增人名（例：弟弟）">
                    <button onclick="addUser()">+ 新增</button>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeSettingsModal()">關閉</button>
                <button class="btn-save" onclick="saveSettings()">💾 保存設定</button>
            </div>
        </div>
    </div>

    <script>
        const itinerary = [
            { date: '11/26', day: '三', activity: '✈️ 紐約到達 (TPE→JFK)', accommodation: '大姐家' },
            { date: '11/27', day: '四', activity: '🗽 紐約自由行', accommodation: '大姐家' },
            { date: '11/28', day: '五', activity: '✈️ 卡加利 (EWR→YYC)', accommodation: 'Delta Hotels' },
            { date: '11/29', day: '六', activity: '🏔️ GetYourGuide 班夫一日遊', accommodation: 'Delta Hotels' },
            { date: '11/30', day: '日', activity: '✈️ 抵達黃刀 (YYC→YZF)\n🌌 晚上10:00PM極光之旅', accommodation: 'Chateau Nova 湖畔木屋' },
            { date: '12/01', day: '一', activity: '🏙️ 黃刀市區遊（龍彩）\n🐟 網紅魚餐廳 Bullocks Bistro（享用新鮮北極鱈魚或原住民傳統餐）\n🌌 追獵極光', accommodation: 'Chateau Nova' },
            { date: '12/02', day: '二', activity: '🎣 冰凍大奴湖捕魚體驗\n🐕 狗拉雪橇\n🌌 極光圈區追獵極光', accommodation: 'Chateau Nova' },
            { date: '12/03', day: '三', activity: '✈️ 搭機返回紐約 (YZF→EWR)', accommodation: '大姐家' },
            { date: '12/04', day: '四', activity: '🏙️ 紐約休整', accommodation: '大姐家' },
            { date: '12/05', day: '五', activity: '🎒 準備行李', accommodation: '大姐家' },
            { date: '12/06', day: '六', activity: '✈️ 返台 (JFK→TPE)', accommodation: '機上' },
            { date: '12/08', day: '一', activity: '🏠 抵達台北', accommodation: '-' },
        ];

        const webAppUrl = 'https://script.google.com/macros/s/AKfycbzX0ZtriCa4xuMtXBtwKTJTHRfR3Hvr8-9e9pDYykRD0Fc63ZK5JPDTXK5qP7X-qCWn/exec';

        // 預設選項
        let defaultCategories = ['✈️ 機票', '🏨 住宿', '🎫 活動', '🍽️ 餐飲', '🚗 交通', '🛍️ 購物', '📌 其他'];
        let defaultCurrencies = ['USD', 'CAD', 'TWD'];
        let defaultUsers = ['Joyce', '姐姐', '媽媽', '爸爸'];

        // 從 localStorage 載入設定
        let categories = JSON.parse(localStorage.getItem('categories')) || defaultCategories;
        let currencies = JSON.parse(localStorage.getItem('currencies')) || defaultCurrencies;
        let users = JSON.parse(localStorage.getItem('users')) || defaultUsers;

        let currentUser = localStorage.getItem('currentUser') || 'Joyce';
        let expenses = [];

        // 初始化
        document.getElementById('expenseDate').valueAsDate = new Date();
        loadItinerary();
        updateSelectOptions();
        document.getElementById('userDisplay').textContent = currentUser;
        refreshExpenses();

        // 每 10 秒自動重新整理一次
        setInterval(() => {
            refreshExpenses();
        }, 10000);

        function updateSelectOptions() {
            // 更新類別
            const categorySelect = document.getElementById('expenseCategory');
            categorySelect.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');

            // 更新幣別
            const currencySelect = document.getElementById('expenseCurrency');
            currencySelect.innerHTML = currencies.map(curr => `<option value="${curr}">${curr}</option>`).join('');

            // 更新使用者
            const userSelect = document.getElementById('userSelect');
            userSelect.innerHTML = users.map(user => `<option value="${user}">${user}</option>`).join('');
            userSelect.value = currentUser;
        }

        function changeUser() {
            currentUser = document.getElementById('userSelect').value;
            localStorage.setItem('currentUser', currentUser);
            document.getElementById('userDisplay').textContent = currentUser;
            showNotification(`✅ 已切換為 ${currentUser}`);
        }

        function loadItinerary() {
            const html = itinerary.map(item => `
                <div class="timeline-item">
                    <div class="timeline-date">${item.date} (${item.day})</div>
                    <div class="timeline-activity">${item.activity}</div>
                    <div class="timeline-accommodation">${item.accommodation}</div>
                </div>
            `).join('');
            document.getElementById('timelineList').innerHTML = html;
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.add('show');
            renderSettingsList();
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function renderSettingsList() {
            // 類別清單
            document.getElementById('categoryList').innerHTML = categories.map((cat, idx) => `
                <div class="option-item">
                    <input type="text" value="${cat}" onchange="categories[${idx}] = this.value">
                    <button class="btn-remove" onclick="categories.splice(${idx}, 1); renderSettingsList()">✕ 刪除</button>
                </div>
            `).join('');

            // 幣別清單
            document.getElementById('currencyList').innerHTML = currencies.map((curr, idx) => `
                <div class="option-item">
                    <input type="text" value="${curr}" onchange="currencies[${idx}] = this.value">
                    <button class="btn-remove" onclick="currencies.splice(${idx}, 1); renderSettingsList()">✕ 刪除</button>
                </div>
            `).join('');

            // 人名清單
            document.getElementById('userList').innerHTML = users.map((user, idx) => `
                <div class="option-item">
                    <input type="text" value="${user}" onchange="users[${idx}] = this.value">
                    <button class="btn-remove" onclick="users.splice(${idx}, 1); renderSettingsList()">✕ 刪除</button>
                </div>
            `).join('');
        }

        function addCategory() {
            const input = document.getElementById('newCategory').value.trim();
            if (input) {
                categories.push(input);
                document.getElementById('newCategory').value = '';
                renderSettingsList();
            }
        }

        function addCurrency() {
            const input = document.getElementById('newCurrency').value.trim();
            if (input) {
                currencies.push(input);
                document.getElementById('newCurrency').value = '';
                renderSettingsList();
            }
        }

        function addUser() {
            const input = document.getElementById('newUser').value.trim();
            if (input) {
                users.push(input);
                document.getElementById('newUser').value = '';
                renderSettingsList();
            }
        }

        function saveSettings() {
            localStorage.setItem('categories', JSON.stringify(categories));
            localStorage.setItem('currencies', JSON.stringify(currencies));
            localStorage.setItem('users', JSON.stringify(users));
            updateSelectOptions();
            closeSettingsModal();
            showNotification('✅ 設定已保存！');
        }

        function addExpense() {
            const date = document.getElementById('expenseDate').value;
            const category = document.getElementById('expenseCategory').value;
            const desc = document.getElementById('expenseDesc').value;
            const amount = document.getElementById('expenseAmount').value;
            const currency = document.getElementById('expenseCurrency').value;
            const memo = document.getElementById('expenseMemo').value;

            if (!desc || !amount) {
                showNotification('❌ 請填入內容和金額', true);
                return;
            }

            const expense = {
                date: date,
                category: category,
                description: desc,
                amount: parseFloat(amount),
                currency: currency,
                memo: memo
            };

            const payload = {
                action: 'add',
                expense: expense
            };

            fetch(webAppUrl, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(resp => resp.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('expenseDate').valueAsDate = new Date();
                    document.getElementById('expenseDesc').value = '';
                    document.getElementById('expenseAmount').value = '';
                    document.getElementById('expenseMemo').value = '';

                    showNotification(`✅ ${currentUser} 新增支出成功！`);
                    setTimeout(() => refreshExpenses(), 1000);
                } else {
                    showNotification('❌ 儲存失敗：' + (data.error || '未知錯誤'), true);
                }
            })
            .catch(err => {
                showNotification('❌ 網路錯誤：' + err.message, true);
            });
        }

        function deleteExpense(rowNumber) {
            if (confirm('確定要刪除這筆記錄嗎？')) {
                const payload = {
                    action: 'delete',
                    rowNumber: rowNumber
                };

                fetch(webAppUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(resp => resp.json())
                .then(data => {
                    if (data.success) {
                        showNotification('✅ 支出已刪除');
                        refreshExpenses();
                    } else {
                        showNotification('❌ 刪除失敗', true);
                    }
                })
                .catch(err => {
                    showNotification('❌ 網路錯誤：' + err.message, true);
                });
            }
        }

        function refreshExpenses() {
            const url = webAppUrl + '?action=read';
            
            fetch(url)
            .then(resp => resp.json())
            .then(data => {
                if (data.expenses) {
                    expenses = data.expenses;
                    updateExpenseList();
                    updateStats();
                }
            })
            .catch(err => {
                console.error('載入失敗：', err);
            });
        }

        function updateExpenseList() {
            if (expenses.length === 0) {
                document.getElementById('expenseListContainer').innerHTML = '<div class="empty-state">💳 還沒有支出記錄</div>';
                return;
            }

            const sorted = expenses.sort((a, b) => new Date(b.date) - new Date(a.date));
            const html = sorted.map(exp => `
                <div class="expense-item">
                    <div class="expense-info">
                        <div class="expense-date">${exp.date}</div>
                        <div>
                            <span class="expense-category">${exp.category}</span>
                            ${exp.description}
                            ${exp.memo ? '<div style="font-size: 11px; color: #999; margin-top: 2px;">備註：' + exp.memo + '</div>' : ''}
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <div class="expense-amount">
                            ${exp.currency}
                            ${parseFloat(exp.amount).toFixed(2)}
                        </div>
                        <button class="button btn-danger" onclick="deleteExpense(${exp.rowNumber})">✕</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('expenseListContainer').innerHTML = html;
        }

        function updateStats() {
            const total = expenses.reduce((sum, exp) => sum + parseFloat(exp.amount || 0), 0);
            document.getElementById('totalAmount').textContent = '$' + total.toFixed(2);
            document.getElementById('totalCount').textContent = expenses.length;
        }

        function showNotification(message, isError = false) {
            const div = document.createElement('div');
            div.className = 'notification' + (isError ? ' error' : '');
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // 點擊 Modal 外部時關閉
        window.onclick = function(event) {
            const modal = document.getElementById('settingsModal');
            if (event.target == modal) {
                modal.classList.remove('show');
            }
        }
    </script>
</body>
</html>
